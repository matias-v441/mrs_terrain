  vertical_crs: EPSG:4979
  vertical_datum: wgs84-ellipsoid
  unit: m
  dtype: float32
  nodata: -9999.0
grid:
  resolution_x: 2.0
  resolution_y: 2.0
  tile_width_px: 4096
  tile_height_px: 4096
  origin_x: -999999.6
  origin_y: -800000.12
  axis_order: east_north
  tile_span_x: 8192.0
  tile_span_y: 8192.0
  index_convention: origin is the west/north edge of tile (0, 0); ix increases eastward,
    iy increases southward; ix = floor((x - origin_x) / tile_span_x), iy = floor((origin_y
