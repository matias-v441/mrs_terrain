  service_url: https://ags.cuzk.gov.cz/arcgis2/rest/services/dmr5g/ImageServer
transform:
  vertical:
    method: proj
    target: wgs84-ellipsoid
    network_enabled: false
    proj_operation: Inverse of Krovak East North (Greenwich) + S-JTSK to ETRS89 (1)
      + Inverse of ETRS89 to Baltic 1957 height (2) + ETRS89 to WGS 84 (1) (with axis
      order normalized for visualization)
    proj_operation_accuracy_m: 2.03
    proj_grids:
    - cz_cuzk_CR-2005.tif
