    proj_operation: Inverse of Krovak East North (Greenwich) + S-JTSK to ETRS89 (1)
      + Inverse of ETRS89 to Baltic 1957 height (2) + ETRS89 to WGS 84 (1) (with axis
      order normalized for visualization)
