  lattice_origin_lon: -180.0
  lattice_origin_lat: 90.0
  resolution_m: 0.25
  resolution_deg: 2.2457779374775424e-06
  tile_size_px: 8192
  tile_span_deg: 0.018397412863816028
  index_convention: origin is the west/north edge of lattice pixel (0, 0); ix increases
    eastward, iy increases southward; ix = floor((lon - lattice_origin_lon) / tile_span_deg),
    iy = floor((lattice_origin_lat - lat) / tile_span_deg); tiles do not overlap,
    and the height and rgb tiles of one index cover the same area
  height:
    resolution_deg: 1.796622349982034e-05
    height_factor: 8
    tile_width_px: 1024
    tile_height_px: 1024
    tile_pattern: wgs/height/tile_{ix}_{iy}.tif
    dtype: float32
    unit: m
    nodata: -9999.0
    vertical_crs: EPSG:4979
    vertical_datum: wgs84-ellipsoid
    derivation: bilinear sample of the EPSG:5514 height tiles at each pixel centre,
      exactly as the sampling contract defines; nodata where the sampler returns none
    storage:
      format: geotiff
      compression: deflate
      predictor: 3
      block_width_px: 256
      block_height_px: 256
    processing_version: '1'
  rgb:
    resolution_deg: 2.2457779374775424e-06
