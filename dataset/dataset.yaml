  - green
  - blue
  dtype: uint8
  mask: internal
  resolution_m: 0.25
  resolution_deg: 2.2457779374775424e-06
  lattice_origin_lon: -180.0
  lattice_origin_lat: 90.0
  tile_pattern: rgb/tile_{ix}_{iy}.tif
  tile_extent: rgb tile (ix, iy) covers the EPSG:4326 bounding box of height tile
    (ix, iy) grown by half a height pixel, snapped outward to the lattice; find it
    as for the height tile, then locate pixels with its own geotransform. Only pixels
    around the safety areas hold imagery; the internal mask marks them.
